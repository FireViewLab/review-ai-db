# 기존 MySQL 볼륨을 유지하며 분석 결과를 저장한다. 미확정 수집 API는 기본 OFF.
services:
  ai:
    build: .
    container_name: review-ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: ai-db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-review_system}
      ENABLE_EXPERIMENTAL_COLLECTION: ${ENABLE_EXPERIMENTAL_COLLECTION:-0}
      REQUIRE_INTERNAL_TOKEN: ${REQUIRE_INTERNAL_TOKEN:-0}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      DATA_INTERNAL_TOKEN: ${DATA_INTERNAL_TOKEN:-}
      DATA_SERVER_BASE_URL: ${DATA_SERVER_BASE_URL:-}
      CRAWLER_BASE_URL: ${CRAWLER_BASE_URL:-}
      CRAWLER_STREAM_TIMEOUT: ${CRAWLER_STREAM_TIMEOUT:-60}
      CRAWLER_MAX_RETRIES: ${CRAWLER_MAX_RETRIES:-0}
      ENABLE_GROQ_REASON_NATURALIZATION: ${ENABLE_GROQ_REASON_NATURALIZATION:-0}
      GROQ_API_KEY_PRIMARY: ${GROQ_API_KEY_PRIMARY:-}
      GROQ_API_KEY_SECONDARY: ${GROQ_API_KEY_SECONDARY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-5}
      PTEXT_MODEL_PATH: ${PTEXT_MODEL_PATH:-/models/ptext-koelectra-v1-2epoch-20260929}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${PTEXT_MODEL_HOST_PATH:-./models/ptext-koelectra-v1-2epoch-20260929}
        target: ${PTEXT_MODEL_PATH:-/models/ptext-koelectra-v1-2epoch-20260929}
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ai-db:
        condition: service_healthy
  ai-db:
    image: mysql:8.0
    container_name: review_ai_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-review_system}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - ai-db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  ai-db-data:
