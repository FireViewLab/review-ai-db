# main의 테스트 통과 후 새 Azure Ubuntu VM에 독립 AI 서비스를 배포한다.
name: Azure AI Deploy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: azure-ai-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose config --quiet
        env:
          DB_PASSWORD: ci-config-only-not-for-deployment
      - run: docker compose build
        env:
          DB_PASSWORD: ci-config-only-not-for-deployment

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          port: 22
          script: |
            set -eu
            cd /home/reviewadmin/review-ai-db
            test "$(git branch --show-current)" = main
            git pull --ff-only origin main
            sudo docker compose up -d --build
            if ! curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors \
              http://localhost:8000/health; then
              echo "AI health check failed after retries" >&2
              sudo docker compose ps || true
              sudo docker compose logs --no-color --tail 200 ai || true
              exit 1
            fi
