# main/PR의 테스트와 이미지 빌드만 검증한다. 배포는 GCP 수동 워크플로로 분리한다.
name: AI CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ai-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose config --quiet
        env:
          DB_PASSWORD: ci-config-only-not-for-deployment
      - run: docker compose build
        env:
          DB_PASSWORD: ci-config-only-not-for-deployment
